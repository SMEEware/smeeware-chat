<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FCF9F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#110D0B" />
    <title>Offline · SMEEware Chat</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fcf9f7;
        --fg: #110d0b;
        --muted: #6b625d;
        --line: #e6e0dc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #110d0b;
          --fg: #f5f0ed;
          --muted: #9a908a;
          --line: #2a2320;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font: 400 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 22rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; border: 1px solid var(--line); }
      h1 { margin: 1.5rem 0 0.5rem; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); font-size: 0.9375rem; }
      button {
        margin-top: 1.75rem;
        padding: 0.625rem 1.25rem;
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 500;
        color: var(--bg);
        background: var(--fg);
        border: 0;
        border-radius: 0.625rem;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>SMEEware Chat needs a connection to reach your server. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
